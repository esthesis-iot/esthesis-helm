##################################################################################################
# Global values
##################################################################################################
devMode: false
domain: ""
esthesisVersion: "3.0.59-SNAPSHOT"
oidcRedirectUri: ""
timezone: "Europe/Athens"
imagePullSecret: ""
ingressClassName: ""

# Enable/disable charts
charts_enabled:
  kafka-ui: false
  orion: false
  docker-registry-ui: false
  grafana-tempo: false
  grafana-loki: false
  grafana: false
  ingress-nginx: false
  ollama: false

##################################################################################################
# Accounts
##################################################################################################
esthesisAdminUsername: esthesis-admin
esthesisAdminPassword: esthesis-admin
esthesisSystemUsername: esthesis-system
esthesisSystemPassword: esthesis-system

##################################################################################################
# Mosquitto
##################################################################################################
mosquittoEnabled: true
mosquittoServiceType: LoadBalancer
mosquittoMutualTls: false
mosquittoSuperuser: esthesis
mosquittoCaCert: ""
mosquittoServerCert: ""
mosquittoServerKey: ""

##################################################################################################
# Redis
##################################################################################################
redis:
  fullnameOverride: "redis"
  global:
    imagePullSecrets: []
  auth:
    password: esthesis-system

##################################################################################################
# MongoDB (Percona Operator + DB)
##################################################################################################
psmdb-operator: {}

psmdb-db:
  name: "mongodb"
  clusterServiceDNSSuffix: cluster.local
  replsets:
    rs0:
      size: 1
  users:
    - name: esthesis-system
      db: admin
      passwordSecretRef:
        name: esthesis-system
        key: password
      roles:
        - name: dbAdmin
          db: esthesiscore

##################################################################################################
# Kafka (Strimzi)
##################################################################################################
strimzi-kafka-operator: {}

kafka:
  name: kafka
  namespace: default
  kraft:
    enabled: true
  replicas: 3
  storage:
    type: persistent-claim
    size: 20Gi
    class: ""          # set StorageClass if needed

  auth:
    type: scram-sha-512
    users:
      - name: esthesis-system
        password: esthesis-system

  topics:
    - name: esthesis-command-reply
      partitions: 3
      replicationFactor: 3
    - name: esthesis-telemetry
      partitions: 3
      replicationFactor: 3
    - name: esthesis-metadata
      partitions: 3
      replicationFactor: 3
    - name: esthesis-app-unicast
      partitions: 3
      replicationFactor: 3
    - name: esthesis-app-broadcast
      partitions: 3
      replicationFactor: 3
    - name: esthesis-ping
      partitions: 3
      replicationFactor: 3
    - name: esthesis-command-request
      partitions: 3
      replicationFactor: 3

  brokerConfig:
    "offsets.topic.replication.factor": "3"
    "transaction.state.log.replication.factor": "3"

##################################################################################################
# Kafka UI (Provectus)
##################################################################################################
kafka-ui:
  fullnameOverride: "kafka-ui"
  imagePullSecrets: []
  yamlApplicationConfig:
    kafka:
      clusters:
        - name: kafka
          bootstrapServers: "kafka-kafka-bootstrap:9092"
          properties:
            security.protocol: SASL_PLAINTEXT
            sasl.mechanism: SCRAM-SHA-512
            sasl.jaas.config: >
              org.apache.kafka.common.security.scram.ScramLoginModule required
              username="esthesis-system" password="esthesis-system";

##################################################################################################
# Keycloak (codecentric/keycloakx)
##################################################################################################
keycloakx:
  fullnameOverride: "keycloak"
  image:
    pullSecrets: []
  replicas: 1
  env:
    - name: KEYCLOAK_ADMIN
      value: esthesis-system
    - name: KEYCLOAK_ADMIN_PASSWORD
      value: esthesis-system
    - name: KC_PROXY_HEADERS
      value: xforwarded
    - name: KC_HTTP_ENABLED
      value: "true"
  postgresql:
    enabled: true
    auth:
      postgresPassword: "esthesis-system"
      password: "esthesis-system"
  ingress:
    enabled: true
    hostname: keycloak.esthesis
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-cluster-issuer"
    tls: true

##################################################################################################
# Camunda
##################################################################################################
camunda-platform:
  global:
    zeebeClusterName: "zeebe"
    image:
      pullSecrets: []
    identity:
      keycloak:
        url:
          protocol: "http"
          host: "keycloak-headless"
          port: "8080"
      auth:
        enabled: false
  operate:
    enabled: false
  optimize:
    enabled: false
  tasklist:
    enabled: false
  identity:
    enabled: false
  identityKeycloak:
    enabled: false
  webModeler:
    enabled: false
  connectors:
    enabled: false
  zeebe:
    enabled: true
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
  zeebeGateway:
    enabled: true
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
  elasticsearch:
    enabled: true
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"

##################################################################################################
# InfluxDB2 (InfluxData)
##################################################################################################
influxdb2:
  fullnameOverride: "influxdb"
  image:
    pullSecrets: []
  adminUser:
    organization: esthesis
    bucket: esthesis
    user: esthesis-system
    password: esthesis-system
    token: "918UdZNzKNEf7YeL7efV"
  persistence:
    enabled: true
    size: 32Gi

##################################################################################################
# Grafana (official)
##################################################################################################
grafana:
  fullnameOverride: "grafana"
  adminUser: esthesis-system
  adminPassword: esthesis-system
  image:
    pullSecrets: []

##################################################################################################
# Loki (official)
##################################################################################################
loki:
  fullnameOverride: "grafana-loki"
  promtail:
    enabled: true

##################################################################################################
# Tempo (official)
##################################################################################################
tempo:
  fullnameOverride: "grafana-tempo"
  tempo:
    traces:
      jaeger:
        grpc: false
        thriftHttp: false
      otlp:
        grpc: true

##################################################################################################
# Ingress-NGINX (official)
##################################################################################################
ingress-nginx:
  fullnameOverride: "ingress-nginx"
  controller:
    scope:
      enabled: false
      namespace: default
    service:
      externalIPs:
        - "192.168.1.1"
      annotations:
        external-dns.alpha.kubernetes.io/hostname: "*.esthesis"
        service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
        service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "https"
        service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "3600"
    ingressClassResource:
      name: "nginx-default"

##################################################################################################
# Docker Registry UI
##################################################################################################
docker-registry-ui:
  fullnameOverride: "docker-registry-ui"
  global:
    name: docker-registry
    imagePullSecrets: []
  ui:
    proxy: true
    deleteImages: true
  registry:
    enabled: true
    service:
      type: NodePort
      nodePort: ""

##################################################################################################
# Ollama
##################################################################################################
ollama:
  fullnameOverride: "ollama"
  ollama:
    models:
      pull:
        - "qwen3:0.6b"
        - "nomic-embed-text"
      run:
        - "qwen3:0.6b"
