{{- if and .Values.kafka .Values.kafka.topics }}
{{- range .Values.kafka.topics }}
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{ .name }}
  labels:
    strimzi.io/cluster: {{ $.Values.kafka.name | default "kafka" }}
spec:
  partitions: {{ .partitions | default 1 }}
  replicas: {{ .replicationFactor | default 1 }}
---
{{- end }}
{{- end }}
