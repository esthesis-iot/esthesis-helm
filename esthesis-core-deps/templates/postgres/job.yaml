apiVersion: batch/v1
kind: Job
metadata:
  name: pg-bootstrap
  labels:
    app.kubernetes.io/name: pg-bootstrap
    helm.sh/hook: post-install
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-bootstrap
    spec:
      restartPolicy: Never
      {{- if .Values.pg_db.cluster.imagePullSecrets }}
      imagePullSecrets:
    {{ .Values.pg_db.cluster.imagePullSecrets | toYaml | indent 4 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.superuserSecretName" . }}
                  key: host
          command: ["sh","-c"]
          args:
            - |
              set -eu
              echo "Waiting for PostgreSQL at $PGHOST:5432 ..."
              until pg_isready -h "$PGHOST" -p 5432 -t 2; do
                echo "Postgres not ready yet, sleeping 10s"
                sleep 10
              done
              echo "Postgres is UP!"
      containers:
        - name: bootstrap-and-load
          image: postgres:16
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.superuserSecretName" . }}
                  key: host
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.superuserSecretName" . }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg.superuserSecretName" . }}
                  key: password
            - name: PGDATABASE
              value: postgres
          volumeMounts:
            - name: sql-scripts
              mountPath: /sql
              readOnly: true
          command: ["sh","-c"]
          args:
            - |
              set -euo pipefail

              echo "== [PG BOOTSTRAP] Databases missing. Proceeding with bootstrap…"

              echo "== Running bootstrap SQL (roles, DBs, grants)…"
              psql -v ON_ERROR_STOP=1 -a -f /sql/init.sql
      volumes:
        - name: sql-scripts
          projected:
            sources:
              - configMap:
                  name: postgres-init
                  items:
                    - key: init.sql
                      path: init.sql
