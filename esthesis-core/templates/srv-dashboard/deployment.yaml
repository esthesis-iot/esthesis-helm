{{ if not .Values.devMode }}
{{ template "deployment.api.template" (merge (dict
  "podOidc" true
  "podOidcClient" true
  "podMongoDb" true
  "podKafka" true
  "podLogging" true
  "podRedis" true
  "podReqCpu" "250m"
  "podReqMemory" "256M"
  "podMaxCpu" "1"
  "podMaxMemory" "512M"
  "podName" "esthesis-core-srv-dashboard"
  "podProbes" true
  "registry" .Values.esthesisRegistry
  "timezone" .Values.timezone
  "imagePullSecret" .Values.imagePullSecret
) .) }}
{{ end }}
