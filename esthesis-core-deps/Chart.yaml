apiVersion: v2
name: esthesis-core-deps
home: https://esthes.is
sources:
  - https://github.com/esthesis-iot
maintainers:
  - name: European Dynamics SA
    email: esthesis@eurodyn.com
    url: https://www.eurodyn.com
icon: https://esthes.is/media/logo.png
version: "3.1.3"
appVersion: "3.1.3"

dependencies:
  - name: redis
    version: "0.1.5"
    repository: oci://registry-1.docker.io/cloudpirates
  - name: psmdb-db
    version: "1.20.1"
    repository: https://percona.github.io/percona-helm-charts
  - name: psmdb-operator
    version: "1.20.1"
    repository: https://percona.github.io/percona-helm-charts
  - name: strimzi-kafka-operator
    version: "0.47.0"
    repository: https://strimzi.io/charts/
  - name: kafka-ui
    version: "0.7.6"
    repository: https://provectus.github.io/kafka-ui-charts
    condition: charts_enabled.kafka-ui
  - name: pg-operator
    version: "2.7.0"
    repository: https://percona.github.io/percona-helm-charts/
  - name: pg-db
    version: "2.7.0"
    repository: https://percona.github.io/percona-helm-charts/
  - name: keycloakx
    version: "7.1.2"
    repository: https://codecentric.github.io/helm-charts
  - name: grafana
    version: "9.3.4"
    repository: https://grafana.github.io/helm-charts
    condition: charts_enabled.grafana
  - name: loki
    version: "6.33.0"
    repository: https://grafana.github.io/helm-charts
    condition: charts_enabled.grafana-loki
  - name: ingress-nginx
    version: "4.9.1"
    repository: https://kubernetes.github.io/ingress-nginx
    condition: charts_enabled.ingress-nginx
  - name: camunda-platform
    version: "10.0.2"
    repository: https://helm.camunda.io
  - name: influxdb2
    version: "2.1.2"
    repository: https://helm.influxdata.com
  - name: orion
    version: "1.3.0"
    repository: https://fiware.github.io/helm-charts/
    condition: charts_enabled.orion
  - name: docker-registry-ui
    version: "1.1.3"
    repository: https://helm.joxit.dev
    condition: charts_enabled.docker-registry-ui
  - name: tempo
    version: "1.23.3"
    repository: https://grafana.github.io/helm-charts
    condition: charts_enabled.grafana-tempo
  - name: ollama
    version: "1.16.0"
    repository: https://otwld.github.io/ollama-helm
    condition: charts_enabled.ollama
