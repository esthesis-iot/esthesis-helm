##################################################################################################
# Global values
##################################################################################################
devMode: true

domain: esthesis
esthesisVersion: "3.0.59-SNAPSHOT"
#esthesisLocalCharts: true
esthesisReportedOidcPostLogoutUrl: http://localhost:4200/logged-out
oidcRedirectUri: http://localhost:4200/callback
timezone: "Europe/Athens"
ingressClassName:
imagePullSecret: ""

# Enable/disable charts
charts_enabled:
  kafka-ui: false
  orion: false
  docker-registry-ui: false
  grafana-tempo: false
  grafana-loki: false
  grafana: false
  ingress-nginx: false
  ollama: false

##################################################################################################
# Accounts to be used throughout charts.
##################################################################################################
esthesisAdminUsername: esthesis-admin
esthesisAdminPassword: esthesis-admin
esthesisSystemUsername: esthesis-system
esthesisSystemPassword: esthesis-system

##################################################################################################
##################################################################################################
# Mosquitto Values
##################################################################################################
mosquittoEnabled: true
mosquittoServiceType: ClusterIP
mosquittoMutualTls: false
mosquittoSuperuser: esthesis
mosquittoCaCert: ""
mosquittoServerCert: ""
mosquittoServerKey: ""

# Redis configuration (Cloudpirates)
redis:
  fullnameOverride: "redis"
  image:
    pullSecrets: []
  # Cloudpirates specific
  usePassword: true
  password: "esthesis-system"
  persistence:
    enabled: false # Default for dev

# MongoDB configuration (Percona Server for MongoDB)
psmdb-db:
  fullnameOverride: "mongodb"
  replsets:
    - name: rs0
      size: 1
      volumeSpec:
        pvc:
          resources:
            requests:
              storage: 10Gi
  secrets:
    users: esthesis-core-deps-psmdb-db-users
  # We need to create the secret manually or via a template if the chart doesn't support inline passwords easily.
  # For dev simplicity, we assume the operator/chart handles some defaults or we rely on the user to create secrets.
  # However, to match previous behavior, we might need a template to create the secret.

# Kafka configuration (Strimzi)
# This is handled by templates/kafka/strimzi-kafka.yaml which uses .Values.kafka
kafka:
  name: "kafka"
  replicas: 1
  version: "3.9.0"
  metadataVersion: "3.9-IV0"
  storage:
    type: "persistent-claim"
    size: "10Gi"
  auth:
    type: "scram-sha-512"
  config:
    offsets.topic.replication.factor: "1"
    transaction.state.log.replication.factor: "1"
    transaction.state.log.min.isr: "1"
    default.replication.factor: "1"
    min.insync.replicas: "1"

# Keycloak configuration (Codecentric KeycloakX)
keycloakx:
  fullnameOverride: "keycloak"
  image:
    tag: "24.0.5"
  command:
    - "/opt/keycloak/bin/kc.sh"
    - "start"
    - "--http-enabled=true"
    - "--hostname-strict=false"
    - "--hostname-strict-https=false"
  extraEnv: |
    - name: KEYCLOAK_ADMIN
      value: "esthesis-system"
    - name: KEYCLOAK_ADMIN_PASSWORD
      value: "esthesis-system"
    # Database connection
    - name: KC_DB
      value: "postgres"
    - name: KC_DB_URL
      value: "jdbc:postgresql://postgres-pg-db:5432/keycloak"
    - name: KC_DB_USERNAME
      value: "keycloak"
    - name: KC_DB_PASSWORD
      value: "esthesis-system"
  http:
    relativePath: "/"

# Postgres configuration (Percona for PostgreSQL)
pg-db:
  fullnameOverride: "postgres"
  # Percona PG config is complex, usually requires a CR.
  # Assuming the dependency 'pg-db' is the Percona Postgres Operator's DB chart.
  # We might need to check if it creates a cluster.
  cluster:
    size: 1
    users:
      - name: keycloak
        databases:
          - keycloak
        password: esthesis-system

# Camunda configuration
camunda-platform:
  global:
    zeebeClusterName: "zeebe"
    image:
      pullSecrets: []
    identity:
      keycloak:
        url:
          protocol: "http"
          host: "keycloak-headless"
          port: "8080"
      auth:
        enabled: false
  operate:
    enabled: false
  optimize:
    enabled: false
  tasklist:
    enabled: false
  identity:
    enabled: false
  identityKeycloak:
    enabled: false
  webModeler:
    enabled: false
  connectors:
    enabled: false
  zeebe:
    enabled: true
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
    clusterSize: 1
    replicationFactor: 1
  zeebeGateway:
    enabled: true
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
    replicas: 1
  elasticsearch:
    enabled: true
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
    replicas: 1
    minimumMasterNodes: 1

# InfluxDB configuration
influxdb2:
  fullnameOverride: "influxdb"
  global:
    imagePullSecrets: []
  auth:
    admin:
      username: esthesis-system
      password: esthesis-system
      token: "918UdZNzKNEf7YeL7efV"
    user:
      org: esthesis
      bucket: esthesis
      username: esthesis-system
      password: esthesis-system
  persistence:
    size: "32Gi"

# Grafana configuration
grafana:
  fullnameOverride: "grafana"
  global:
    imagePullSecrets: []
  admin:
    user: esthesis-system
    password: esthesis-system

# Kafka UI configuration
kafka-ui:
  fullnameOverride: "kafka-ui"
  imagePullSecrets: []
  yamlApplicationConfig:
    kafka:
      clusters:
        - name: kafka
          bootstrapServers: "kafka-kafka-bootstrap:9092" # Strimzi service name
          properties:
            security.protocol: SASL_PLAINTEXT
            sasl.mechanism: SCRAM-SHA-512
            sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username=esthesis-system password=esthesis-system;"

# Grafana Loki configuration
grafana-loki:
  fullnameOverride: "grafana-loki"
  global:
    imagePullSecrets: []
  promtail:
    enabled: true

# Ingress nginx configuration
ingress-nginx:
  fullnameOverride: "ingress-nginx"
  controller:
    scope:
      enabled: false
      namespace: default
    service:
      externalIPs:
        - "192.168.1.1"
      annotations:
        external-dns.alpha.kubernetes.io/hostname: "*.esthesis"
        service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
        service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "https"
        service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "3600"
    ingressClassResource:
      name: "nginx-default"

# Docker Registry UI configuration
docker-registry-ui:
  fullnameOverride: "docker-registry-ui"
  global:
    name: docker-registry
    imagePullSecrets: []
  ui:
    proxy: true
    deleteImages: true
  registry:
    enabled: true
    service:
      type: NodePort
      nodePort: ""

# Grafana Tempo configuration
grafana-tempo:
  fullnameOverride: "grafana-tempo"
  global:
    imagePullSecrets: []
  tempo:
    traces:
      jaeger:
        grpc: false
        thriftHttp: false
      otlp:
        grpc: true # Needed by Quarkus (port 4317)

# Ollama
ollama:
  fullnameOverride: "ollama"
  ollama:
    models:
      pull:
        - "qwen3:0.6b"
        - "nomic-embed-text"
      run:
        - "qwen3:0.6b"
