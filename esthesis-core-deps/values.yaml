##################################################################################################
# Global values
##################################################################################################
devMode: true
domain: esthesis
esthesisVersion: "3.0.59-SNAPSHOT"
esthesisReportedOidcPostLogoutUrl: http://localhost:4200/logged-out
oidcRedirectUri: http://localhost:4200/callback
timezone: "Europe/Athens"
ingressClassName: ""
imagePullSecret: ""

# Enable/disable charts
charts_enabled:
  kafka-ui: false
  orion: false
  docker-registry-ui: false
  grafana-tempo: false
  grafana-loki: false
  grafana: false
  nginx-ingress: false
  ollama: false

##################################################################################################
# Accounts to be used throughout charts.
##################################################################################################
esthesisAdminUsername: esthesis-admin
esthesisAdminPassword: esthesis-admin
esthesisSystemUsername: esthesis-system
esthesisSystemPassword: esthesis-system

##################################################################################################
# Mosquitto Values
##################################################################################################
mosquittoEnabled: true
mosquittoServiceType: ClusterIP
mosquittoMutualTls: false
mosquittoSuperuser: esthesis
mosquittoCaCert: ""
mosquittoServerCert: ""
mosquittoServerKey: ""

##################################################################################################
# Redis configuration (Cloudpirates)
##################################################################################################
redis:
  fullnameOverride: "redis"
  global:
    imagePullSecrets:
      - name: "regcred"
  auth:
    password: "esthesis-system"
  persistence:
    enabled: false # Default for dev

##################################################################################################
# MongoDB configuration (Percona Server for MongoDB)
##################################################################################################
psmdb-db:
  fullnameOverride: "mongodb"
  imagePullSecrets:
    - name: "regcred"
  tls:
    mode: disabled
  replsets:
    rs0:
      name: rs0
      size: 1
      volumeSpec:
        pvc:
          accessModes: ["ReadWriteOnce"]
          storageClassName: vsphere-csi-sc
          resources:
            requests:
              storage: 10Gi
      arbiter:
        enabled: false
      nonvoting:
        enabled: false
  unsafeFlags:
    replsetSize: true
    tls: true
  sharding:
    enabled: false
  users:
    - name: esthesis-system
      db: esthesiscore
      passwordSecretRef:
        name: esthesis-core-deps-mongo-users
        key: password
      roles:
        - name: dbAdmin
          db: esthesiscore
        - name: readWrite
          db: esthesiscore
  backup:
    enabled: false
  # We need to create the secret manually or via a template if the chart doesn't support inline passwords easily.
  # For dev simplicity, we assume the operator/chart handles some defaults or we rely on the user to create secrets.
  # However, to match previous behavior, we might need a template to create the secret.

##################################################################################################
# Kafka configuration (Strimzi)
# This is handled by templates/kafka/strimzi-kafka.yaml which uses .Values.kafka
##################################################################################################
kafka:
  name: "kafka"
  replicas: 1
  version: "3.9.0"
  metadataVersion: "3.9-IV0"
  storage:
    type: "persistent-claim"
    size: "10Gi"
  auth:
    type: scram-sha-512
  config:
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    default.replication.factor: 1
    min.insync.replicas: 1
    auto.create.topics.enable: "false"
  topics:
    - { name: esthesis-command-reply, partitions: 1, replicationFactor: 1 }
    - { name: esthesis-telemetry, partitions: 1, replicationFactor: 1 }
    - { name: esthesis-metadata, partitions: 1, replicationFactor: 1 }
    - { name: esthesis-app-unicast, partitions: 1, replicationFactor: 1 }
    - { name: esthesis-app-broadcast, partitions: 1, replicationFactor: 1 }
    - { name: esthesis-ping, partitions: 1, replicationFactor: 1 }
    - { name: esthesis-command-request, partitions: 1, replicationFactor: 1 }
  users:
    - name: esthesis-system
      auth: scram-sha-512
      password: "esthesis-system"

##################################################################################################
# Keycloak configuration (Codecentric KeycloakX)
##################################################################################################
keycloakx:
  fullnameOverride: "keycloak"
  image:
    tag: "24.0.5"
  imagePullSecrets:
    - name: regcred
  command:
    - "/opt/keycloak/bin/kc.sh"
    - "start"
    - "--http-enabled=true"
    - "--http-port=8080"
    - "--hostname-strict=false"
  extraEnv: |
    - name: KEYCLOAK_ADMIN
      value: "esthesis-system"
    - name: KEYCLOAK_ADMIN_PASSWORD
      value: "esthesis-system"
    - name: KC_HOSTNAME_STRICT_HTTPS
      value: "false"
    - name: JAVA_OPTS_APPEND
      value: >-
        -Djgroups.dns.query={{ include "keycloak.fullname" . }}-headless
  http:
    relativePath: "/"
  database:
    vendor: postgres
    hostname: postgres-rw
    port: 5432
    database: keycloak
    username: keycloak
    password: esthesis-system
  livenessProbe: |
    httpGet:
      path: '{{ tpl .Values.http.relativePath $ | trimSuffix "/" }}/health/live'
      port: 8080
      scheme: HTTP
    initialDelaySeconds: 30
    timeoutSeconds: 5
  readinessProbe: |
    httpGet:
      path: '{{ tpl .Values.http.relativePath $ | trimSuffix "/" }}/health/ready'
      port: 8080
      scheme: HTTP
    initialDelaySeconds: 30
    timeoutSeconds: 5
  startupProbe: |
    httpGet:
      path: '{{ tpl .Values.http.relativePath $ | trimSuffix "/" }}/health'
      port: 8080
      scheme: HTTP
    initialDelaySeconds: 30
    timeoutSeconds: 5
    failureThreshold: 60
    periodSeconds: 5

##################################################################################################
# Postgres configuration (Percona for PostgreSQL)
##################################################################################################
pg_db:
  fullnameOverride: "postgres"
  type: postgresql
  cluster:
    instances: 1
    imagePullSecrets:
      - name: regcred
    storage:
      size: 10Gi
  imageCatalog:
    enabled: false

##################################################################################################
# Camunda configuration
##################################################################################################
camunda-platform:
  global:
    zeebeClusterName: "zeebe"
    image:
      pullSecrets:
        - name: "regcred"
    identity:
      keycloak:
        url:
          protocol: "http"
          host: "keycloak-headless"
          port: "80"
      auth:
        enabled: false
  operate:
    enabled: false
  optimize:
    enabled: false
  tasklist:
    enabled: false
  identity:
    enabled: false
  identityKeycloak:
    enabled: false
  webModeler:
    enabled: false
  connectors:
    enabled: false
  zeebe:
    enabled: true
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
    clusterSize: 1
    replicationFactor: 1
  zeebeGateway:
    enabled: true
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
    replicas: 1
  elasticsearch:
    enabled: true
    global:
      imagePullSecrets:
        - regcred
    image:
      repository: bitnamilegacy/elasticsearch
    sysctlImage:
      repository: bitnamilegacy/os-shell
    metrics:
      image:
        repository: bitnamilegacy/elasticsearch-exporter
    volumePermissions:
      image:
        repository: bitnamilegacy/os-shell
    copyTlsCerts:
      image:
        repository: bitnamilegacy/os-shell
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
    master:
      replicaCount: 1

##################################################################################################
# InfluxDB configuration
##################################################################################################
influxdb2:
  fullnameOverride: "influxdb"
  image:
    pullSecrets:
      - regcred
  adminUser:
    organization: "esthesis"
    bucket: "esthesis"
    user: "esthesis-system"
    retention_policy: "0s"
    password: "esthesis-system"
    token: "918UdZNzKNEf7YeL7efV"
  persistence:
    size: "32Gi"

##################################################################################################
# Kafka UI configuration
##################################################################################################
kafka-ui:
  fullnameOverride: "kafka-ui"
  imagePullSecrets: []
  yamlApplicationConfig:
    kafka:
      clusters:
        - name: kafka
          bootstrapServers: "kafka-kafka-bootstrap:9092" # Strimzi service name
          properties:
            security.protocol: SASL_PLAINTEXT
            sasl.mechanism: SCRAM-SHA-512
            sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username=esthesis-system password=esthesis-system;"

##################################################################################################
# Grafana configuration
##################################################################################################
grafana:
  fullnameOverride: "grafana"
  global:
    imagePullSecrets: []
  admin:
    user: esthesis-system
    password: esthesis-system

##################################################################################################
# Grafana Loki configuration
##################################################################################################
grafana-loki:
  fullnameOverride: "grafana-loki"
  global:
    imagePullSecrets: []
  promtail:
    enabled: true

##################################################################################################
# F5 NGINX Ingress Controller configuration
##################################################################################################
nginx-ingress:
  fullnameOverride: "nginx-ingress"
  controller:
    kind: deployment
    enableCustomResources: true
    service:
      externalIPs:
        - "192.168.1.1"
      annotations:
        external-dns.alpha.kubernetes.io/hostname: "*.esthesis"
    ingressClass:
      name: "nginx"
      create: true
      setAsDefaultIngressClass: false

##################################################################################################
# Docker Registry UI configuration
##################################################################################################
docker-registry-ui:
  fullnameOverride: "docker-registry-ui"
  global:
    name: docker-registry
    imagePullSecrets: []
  ui:
    proxy: true
    deleteImages: true
  registry:
    enabled: true
    service:
      type: NodePort
      nodePort: ""

##################################################################################################
# Grafana Tempo configuration
##################################################################################################
grafana-tempo:
  fullnameOverride: "grafana-tempo"
  global:
    imagePullSecrets: []
  tempo:
    traces:
      jaeger:
        grpc: false
        thriftHttp: false
      otlp:
        grpc: true # Needed by Quarkus (port 4317)

##################################################################################################
# Ollama
##################################################################################################
ollama:
  fullnameOverride: "ollama"
  ollama:
    models:
      pull:
        - "qwen3:0.6b"
        - "nomic-embed-text"
      run:
        - "qwen3:0.6b"
