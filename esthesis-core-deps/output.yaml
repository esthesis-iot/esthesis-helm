apiVersion: batch/v1
kind: Job
metadata:
  name: create-realm-job
  labels:
    app.kubernetes.io/name: keycloak
    helm.sh/hook: post-install
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: create-realm
          image: docker.io/bitnamilegacy/bitnami/keycloak:24.0.5
          command:
            - /bin/sh
            - -c
            - |
              echo Logging in to Keycloak.
              until kcadm.sh config credentials --server http://keycloak --realm master --user "resonance-system" --password "P3jpnvFQK64SOtM5" --client admin-cli --config /tmp/keycloak.conf;
              do
                echo "Waiting for Keycloak to be ready...";
                sleep 5;
              done;
              echo Creating esthesis realm.
              if kcadm.sh get realms/esthesis --config /tmp/keycloak.conf; then
                echo Realm 'esthesis' already exists. Exiting.
                exit 0
              else
                kcadm.sh create realms -s realm=esthesis -s enabled=true --config /tmp/keycloak.conf
              fi
              echo Creating resonance-admin and resonance-system  users.
              kcadm.sh create users -r esthesis -s username="resonance-admin" -s enabled=true --config /tmp/keycloak.conf
              kcadm.sh set-password -r esthesis --username "resonance-admin" --new-password "by87sjoA2h7IJeM4" --config /tmp/keycloak.conf
              kcadm.sh create users -r esthesis -s username="resonance-system" -s enabled=true --config /tmp/keycloak.conf
              kcadm.sh set-password -r esthesis --username "resonance-system" --new-password "P3jpnvFQK64SOtM5" --config /tmp/keycloak.conf
              echo Creating user and system roles.
              kcadm.sh create roles -r esthesis -s name=user --config /tmp/keycloak.conf
              kcadm.sh create roles -r esthesis -s name=system --config /tmp/keycloak.conf
              echo Creating esthesis client.
              kcadm.sh create clients -r esthesis -s clientId=esthesis -s enabled=true -s publicClient=true -s directAccessGrantsEnabled=true -s serviceAccountsEnabled=true -s "redirectUris=[\"https://esthesis-core.resonance.edrnd.cloud/callback\"]" --config /tmp/keycloak.conf
              echo Assigning roles to users.
              kcadm.sh add-roles -r esthesis --uusername "resonance-admin" --rolename user --config /tmp/keycloak.conf
              kcadm.sh add-roles -r esthesis --uusername "resonance-system" --rolename system --config /tmp/keycloak.conf
              echo Setting default First name, Last name and email for resonance-admin.
              USERID=$(kcadm.sh get users -r esthesis -q username="resonance-admin" --config /tmp/keycloak.conf | grep \"id\" | awk -F'"' '{print $4}')
              kcadm.sh update users/$USERID -r esthesis -s firstName=esthesis -s lastName=admin -s email=esthesis-admin@localhost --config /tmp/keycloak.conf
              echo Setting default First name, Last name and email for resonance-system.
              USERID=$(kcadm.sh get users -r esthesis -q username="resonance-system" --config /tmp/keycloak.conf | grep \"id\" | awk -F'"' '{print $4}')
              kcadm.sh update users/$USERID -r esthesis -s firstName=esthesis -s lastName=system -s email=esthesis-system@localhost --config /tmp/keycloak.conf
              echo Keycloak configuration complete.
      restartPolicy: OnFailure

